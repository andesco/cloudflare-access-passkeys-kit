<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <title>Sign in — andrewe.dev</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body data-page="sign-in">
    <main class="auth-shell">
      <header class="brand">
        <img class="brand-logo" src="/assets/cloudflare-access.svg" alt="Cloudflare Access">
      </header>
      <section class="auth-card" aria-labelledby="sign-in-title">
        <div class="auth-card__body">
          <div class="app-identity"><span data-app-name>andrewe.dev</span></div>
          <h1 id="sign-in-title">Sign in to <span data-login-target>andrewe.dev</span></h1>
          <div id="sign-in-options" class="auth-options">
            <div class="auth-group">
              <button id="primary-action" class="provider-button" type="button">
                <svg aria-hidden="true" viewBox="0.10 -80.44 100 100" fill="currentColor"><path d="M42.041-36.3281C50.2441-36.3281 57.4707-43.7012 57.4707-53.3203C57.4707-62.8906 50.2441-69.8242 42.041-69.8242C33.8867-69.8242 26.6602-62.6953 26.6602-53.2227C26.6602-43.7012 33.8867-36.3281 42.041-36.3281ZM16.5527-0.683594L67.8223-0.683594L67.8223-11.5723C63.3301-14.6484 60.4492-19.5312 60.1074-25.1465C55.1758-27.7832 49.0723-29.4922 42.041-29.4922C22.168-29.4922 9.76562-15.8203 9.76562-5.9082C9.76562-2.63672 12.3047-0.683594 16.5527-0.683594Z"/><path d="M78.125-38.7695C71.1914-38.7695 65.7227-33.3008 65.7227-26.4648C65.7227-21.2402 68.7988-16.8457 73.5352-14.9414L73.5352 4.00391C73.5352 4.54102 73.7793 4.88281 74.1211 5.27344L77.3438 8.49609C77.7344 8.88672 78.3203 8.93555 78.8086 8.49609L84.9121 2.44141C85.3516 2.00195 85.3516 1.36719 84.9121 0.927734L81.2012-2.7832L86.377-7.86133C86.8164-8.25195 86.8164-8.88672 86.2793-9.375L81.2012-14.4043C87.1094-16.8457 90.4297-21.1426 90.4297-26.4648C90.4297-33.3008 84.9121-38.7695 78.125-38.7695ZM78.0762-33.7891C80.127-33.7891 81.8359-32.0801 81.8359-30.0293C81.8359-27.832 80.127-26.123 78.0762-26.123C75.9766-26.123 74.2188-27.832 74.2188-30.0293C74.2188-32.0801 75.9277-33.7891 78.0762-33.7891Z"/></svg>
                <span>Sign in with passkey</span>
              </button>
              <output id="status" aria-live="polite"></output>
            </div>

            <div class="divider" role="separator" aria-orientation="horizontal"><span>or</span></div>

            <section class="request-invite" aria-label="Request an invitation">
              <form id="invite-request-form">
                <div class="form-row">
                  <label for="invite-email">Email</label>
                  <input id="invite-email" name="email" type="email" autocomplete="email" placeholder="example@email.com" required maxlength="254">
                </div>
                <div id="turnstile-widget"></div>
                <div class="form-row">
                  <button class="primary-button" type="submit">Request invitation</button>
                </div>
              </form>
              <output id="invite-request-status" class="confirmation-message" aria-live="polite"></output>
              <div id="invitation-confirmation" class="information-panel invitation-confirmation" hidden>
                If <span id="invitation-confirmation-email" class="confirmation-email"></span> is authorized, an invitation will be sent.
              </div>
            </section>
          </div>
          <div id="signed-in-options" class="auth-options" hidden>
            <dl class="signed-in-details">
              <div>
                <dt>user:</dt>
                <dd id="signed-in-email"></dd>
              </div>
              <div id="signed-in-created-at-row" hidden>
                <dt>created:</dt>
                <dd id="signed-in-created-at"></dd>
              </div>
            </dl>
            <section class="passkey-manager" aria-labelledby="passkeys-heading">
              <h2 id="passkeys-heading">Passkeys</h2>
              <ul id="passkey-list" class="passkey-list"></ul>
              <button id="add-passkey-action" class="provider-button" type="button">
                <svg aria-hidden="true" viewBox="-8.33 -85.25 100 100" fill="currentColor"><path d="M45.6055-7.27539L45.6055-63.2324C45.6055-65.332 43.8477-67.1875 41.6992-67.1875C39.5508-67.1875 37.7441-65.332 37.7441-63.2324L37.7441-7.27539C37.7441-5.17578 39.5508-3.32031 41.6992-3.32031C43.8477-3.32031 45.6055-5.17578 45.6055-7.27539ZM13.7207-31.2988L69.6777-31.2988C71.7773-31.2988 73.584-33.1055 73.584-35.2539C73.584-37.4023 71.7773-39.209 69.6777-39.209L13.7207-39.209C11.5723-39.209 9.76562-37.4023 9.76562-35.2539C9.76562-33.1055 11.5723-31.2988 13.7207-31.2988Z"/></svg>
                <span>Add a passkey</span>
              </button>
              <output id="passkey-status" aria-live="polite"></output>
            </section>
            <button id="sign-out-action" class="provider-button" type="button">
              <svg aria-hidden="true" viewBox="4.79 -85.25 100 100" fill="currentColor"><path d="M25.9766 5.9082L58.5938 5.9082C68.9941 5.9082 74.8047 0.146484 74.8047-10.3027L74.8047-24.1211L67.7246-24.1211L67.7246-10.3027C67.7246-4.44336 64.4531-1.12305 58.5938-1.12305L25.9766-1.12305C20.1172-1.12305 16.7969-4.44336 16.7969-10.3027L16.7969-60.2051C16.7969-66.0645 20.1172-69.3848 25.9766-69.3848L58.5938-69.3848C64.4531-69.3848 67.7246-66.0645 67.7246-60.2051L67.7246-46.3867L74.8047-46.3867L74.8047-60.2051C74.8047-70.6055 68.9941-76.416 58.5938-76.416L25.9766-76.416C15.5762-76.416 9.76562-70.6055 9.76562-60.2051L9.76562-10.3027C9.76562 0.146484 15.5762 5.9082 25.9766 5.9082Z"/><path d="M43.0176-35.2539C43.0176-33.3984 44.5801-31.7871 46.4355-31.7871L84.4727-31.7871L95.6055-32.3242C97.2168-32.4219 98.5352-33.6426 98.5352-35.2539C98.5352-36.8652 97.2168-38.0859 95.6055-38.1836L84.4727-38.7207L46.4355-38.7207C44.5801-38.7207 43.0176-37.1094 43.0176-35.2539ZM81.2988-48.1934C81.2988-47.3633 81.6406-46.4355 82.3242-45.8008L88.1836-40.4297L93.75-35.2539L88.1836-30.0781L82.3242-24.707C81.6406-24.0723 81.2988-23.1934 81.2988-22.3633C81.2988-20.5078 82.5684-19.1406 84.375-19.1406C85.3027-19.1406 85.9863-19.5312 86.6699-20.2148L98.6328-32.7148C99.5117-33.5938 99.8047-34.375 99.8047-35.2539C99.8047-36.1328 99.5117-36.9141 98.6328-37.793L86.6699-50.293C85.9863-50.9766 85.3027-51.3672 84.375-51.3672C82.5684-51.3672 81.2988-50.0488 81.2988-48.1934Z"/></svg>
              <span>Sign out</span>
            </button>
          </div>
        </div>
      </section>
    </main>
    <footer class="project-credit">
      <a href="https://github.com/andesco/cloudflare-access-passkeys-kit">cloudflare-access-passkeys-kit</a>
    </footer>
    <script type="module" src="/assets/client.js"></script>
  </body>
</html>
